<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 → Valentine</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    transition:background 0.8s ease;
    background:linear-gradient(135deg,#ffd6e8,#d9f3ff);
}

.container{
    width:min(92%,550px);
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(10px);
    border-radius:25px;
    padding:40px 30px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.12);
    transition:.5s ease;
}

.screen{
    opacity:0;
    transform:translateY(15px);
    pointer-events:none;
    max-height:0;
    overflow:hidden;
    transition:all .6s ease;
}

.screen.active{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
    max-height:1000px;
}

h1{
    font-size:3rem;
    color:#ff4d7d;
    margin-bottom:12px;
}

h2{
    font-size:2rem;
    color:#444;
    margin-bottom:18px;
}

p{
    color:#666;
    line-height:1.6;
}

button{
    border:none;
    cursor:pointer;
    padding:14px 30px;
    border-radius:50px;
    font-size:1rem;
    font-weight:600;
    transition:.3s;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
}

button:hover{
    transform:translateY(-3px);
}

.refresh{
    margin-top:28px;
    background:#ff5d8f;
    color:#fff;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:30px;
    position:relative;
    min-height:70px;
}

#yesBtn{
    background:#4CAF50;
    color:white;
}

#noBtn{
    background:#ff5d8f;
    color:white;
    position:relative;
}

.hidden{
    opacity:0;
    pointer-events:none;
    transform:scale(.7);
}

#message{
    margin-top:28px;
    background:#fff6fb;
    border-radius:18px;
    padding:18px;
    display:none;
    animation:fade .5s ease;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
}

#message h3{
